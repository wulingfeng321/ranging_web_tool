server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 404;
}
server {
    listen 80;
    listen [::]:80;
    server_name ranging.wulingfeng.top;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / { return 301 https://ranging.wulingfeng.top$request_uri; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ranging.wulingfeng.top;
    ssl_certificate /etc/letsencrypt/live/ranging.wulingfeng.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ranging.wulingfeng.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 64m;
    client_body_timeout 120s;
    auth_basic "Ranging Studio";
    auth_basic_user_file /etc/nginx/ranging-studio.htpasswd;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Authentication terminates here; the application does not need the password.
        proxy_set_header Authorization "";
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
